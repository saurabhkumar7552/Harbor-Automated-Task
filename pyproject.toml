[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-task-factory"
version = "0.1.0"
description = "Reviewed STEM task authoring and isolated Harbor package validation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6,<7"]

[project.scripts]
stem-factory = "stem_factory.cli:main"

[tool.setuptools.packages.find]
include = ["stem_factory*"]
